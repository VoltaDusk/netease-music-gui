<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c16" />
      <stop offset="50%" stop-color="#121510" />
      <stop offset="100%" stop-color="#0a0c08" />
    </linearGradient>

    <!-- Matcha-Emerald Gradient Ribbon -->
    <linearGradient id="ribbonGrad3A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafda0" />
      <stop offset="45%" stop-color="#d6f379" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="ribbonGrad3B" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6f379" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- NetEase Red Jewel Radial -->
    <radialGradient id="redJewel3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b7b" />
      <stop offset="40%" stop-color="#ec4141" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <filter id="glowShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#d6f379" flood-opacity="0.3" />
    </filter>

    <filter id="redGlow3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ec4141" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad3)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="140" fill="#d6f379" opacity="0.08" filter="blur(35px)" />

  <!-- Infinite Fluid Loop (Headphones / Sound Ribbon / M-W Shape) -->
  <g filter="url(#glowShadow3)">
    <!-- Left Loop Arm -->
    <path
      d="M 160 330 C 120 290, 110 200, 170 145 C 225 95, 290 120, 256 220 C 235 280, 190 360, 256 360 C 322 360, 277 280, 256 220"
      fill="none"
      stroke="url(#ribbonGrad3A)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Loop Arm (Interlocking infinite ribbon) -->
    <path
      d="M 352 330 C 392 290, 402 200, 342 145 C 287 95, 222 120, 256 220"
      fill="none"
      stroke="url(#ribbonGrad3B)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Iconic NetEase Heartbeat Red Gem / Sound Seed -->
  <circle cx="256" cy="256" r="17" fill="url(#redJewel3)" filter="url(#redGlow3)" stroke="rgba(255, 255, 255, 0.85)" stroke-width="2.5" />
</svg>
