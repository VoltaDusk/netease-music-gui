<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b15" />
      <stop offset="50%" stop-color="#121410" />
      <stop offset="100%" stop-color="#0a0c08" />
    </linearGradient>

    <!-- Matcha Neon Gradient -->
    <linearGradient id="matchaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafaa6" />
      <stop offset="60%" stop-color="#d6f379" />
      <stop offset="100%" stop-color="#99d838" />
    </linearGradient>

    <!-- Soft Mist Glow -->
    <linearGradient id="mistGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6f379" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#d6f379" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#d6f379" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glowShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#d6f379" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad1)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Background Ambient Aura -->
  <circle cx="256" cy="256" r="150" fill="url(#mistGrad1)" filter="blur(30px)" />

  <!-- Outer Vinyl Soundwave Grooves (Concentric Circles) -->
  <g opacity="0.3">
    <circle cx="256" cy="256" r="190" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="14 8" />
    <circle cx="256" cy="256" r="168" fill="none" stroke="#d6f379" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="256" cy="256" r="146" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="6 12" />
    <circle cx="256" cy="256" r="124" fill="none" stroke="#d6f379" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Central Dynamic "Mist & Groove" Arcs (Stylized W / Mist / Sound) -->
  <g filter="url(#glowShadow1)">
    <!-- Swirling Mist Ribbon 1 -->
    <path
      d="M 120 256 C 120 160, 190 96, 280 106 C 360 115, 410 180, 400 256 C 390 336, 320 400, 240 396 C 170 392, 140 330, 160 270 C 180 210, 240 180, 290 200 C 330 215, 345 255, 330 285 C 315 315, 275 325, 250 310 C 230 295, 230 270, 245 255 C 255 245, 270 250, 270 260"
      fill="none"
      stroke="url(#matchaGrad1)"
      stroke-width="18"
      stroke-linecap="round"
    />
  </g>

  <!-- Center Core Turntable Eye / Spindle Disc -->
  <circle cx="256" cy="256" r="28" fill="#141712" stroke="url(#matchaGrad1)" stroke-width="4" />
  <circle cx="256" cy="256" r="8" fill="url(#matchaGrad1)" />
</svg>
